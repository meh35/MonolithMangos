- type: job
  id: MonolithServant
  name: job-name-servant
  description: job-description-pdv-denasvar
  playTimeTracker: MonolithServant
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 36000 # 10 hours # mono
    - !type:RoleTimeRequirement
      role: MonolithAcolyte
      time: 36000 # 10 hours
  startingGear: JobServant
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  canBeAntag: true
  icon: JobIconServant
  supervisors: job-supervisors-pdv-denasvar
  weight: 30
  displayWeight: 30
  assignedCompany: Monolith
  setPreference: true
  access:
  - CultServant
  - CultAcolyte
  - Mercenary
  accessGroups:
  - GeneralAccess
  special:
  - !type:GiveItemOnHolidaySpecial # Even cultists get a piece of cake.
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  - !type:AddComponentSpecial
    components:
    - type: MailDisabled
    - type: NpcFactionMember
      factions:
      - Monolithic

